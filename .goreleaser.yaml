version: 2

project_name: envdiff

before:
  hooks:
    - go mod tidy

builds:
  - id: envdiff
    main: ./cmd/envdiff
    binary: envdiff
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/GabrielOliveiraTh/envdiff/internal/cli.version={{.Version}}
      - -X github.com/GabrielOliveiraTh/envdiff/internal/cli.commit={{.Commit}}
      - -X github.com/GabrielOliveiraTh/envdiff/internal/cli.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: GabrielOliveiraTh
    name: envdiff
